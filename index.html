<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Bootstrap tint = the light `bg` token; AppThemeProvider re-syncs this
         to the active mode at runtime. -->
    <meta name="theme-color" content="#f6f1e7" />
    <meta name="application-name" content="خَتْمة" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="خَتْمة" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%app-icons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%BASE_URL%app-icons/favicon-32.png"
    />
    <!-- Member app. All copy is injected from the centralized strings module
         (src/content/strings.ar.ts); the title below is a bootstrap fallback
         that the React entry overrides at runtime. -->
    <title>Khatma</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/entries/member.tsx"></script>
  </body>
</html>
